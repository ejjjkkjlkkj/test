name: ZERO bootstrap validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bootstrap-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Go setup
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Deterministic tests
        working-directory: bootstrap/go
        run: go test ./...
