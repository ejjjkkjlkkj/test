name: ZERO machine language

on:
  push:
    branches:
      - experiment/non-human-zero-v2
  pull_request:
    branches:
      - experiment/non-human-zero-v2
  workflow_dispatch:

jobs:
  language:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Runtime version
        run: node --version
      - name: Execute ZERO self-test
        run: node zero-selftest.js
      - name: Deterministic transfer probe
        run: node zero-runtime.js '◇g6◇ w1|g6 g6!p8 <w1>'
