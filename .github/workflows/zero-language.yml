name: ZERO language smoke test

on:
  push:
    paths:
      - "crates/zero-language/**"
      - ".github/workflows/zero-language.yml"
  pull_request:
    paths:
      - "crates/zero-language/**"
      - ".github/workflows/zero-language.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interpreter-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release interpreter
        run: cargo build --release --manifest-path crates/zero-language/Cargo.toml
      - name: Execute sample program
        shell: bash
        run: |
          set -euo pipefail
          output="$(cargo run --quiet --release --manifest-path crates/zero-language/Cargo.toml -- crates/zero-language/examples/hello.zero)"
          printf '%s\n' "$output"
          grep -qx '299792459' <<< "$output"
          grep -qx 'STATUS=PASS' <<< "$output"
      - name: Run interpreter benchmark smoke test
        shell: bash
        run: |
          set -euo pipefail
          output="$(cargo run --quiet --release --manifest-path crates/zero-language/Cargo.toml -- crates/zero-language/examples/hello.zero --bench 1000)"
          printf '%s\n' "$output"
          grep -qx 'STATUS=PASS' <<< "$output"
          grep -q '^NS_PER_RUN=[0-9][0-9]*$' <<< "$output"
