name: ZERO Rust index

on:
  push:
    branches: [main]
    paths:
      - "crates/zero-index/**"
      - ".github/workflows/zero-rust-index.yml"
  pull_request:
    paths:
      - "crates/zero-index/**"
      - ".github/workflows/zero-rust-index.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-rust-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/zero-index
      - name: Format
        run: cargo fmt --manifest-path crates/zero-index/Cargo.toml
      - name: Tests
        run: cargo test --manifest-path crates/zero-index/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path crates/zero-index/Cargo.toml --all-targets -- -D warnings
      - name: Release build
        run: cargo build --release --manifest-path crates/zero-index/Cargo.toml
      - name: Benchmark cached lookups (measurement, not a global-completion claim)
        run: cargo run --release --manifest-path crates/zero-index/Cargo.toml -- --benchmark --out target/zero-index-benchmark.json crates/zero-index/fixtures/sample.jsonl
      - name: Preserve benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: zero-index-benchmark-${{ github.run_id }}
          path: target/zero-index-benchmark.json
          if-no-files-found: error
          retention-days: 30
