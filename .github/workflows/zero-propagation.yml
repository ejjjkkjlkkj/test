name: ZERO propagation reference benchmark smoke test

on:
  push:
    paths:
      - "crates/zero-propagation/**"
      - "docs/physics/zero-real-sound-light-references.md"
      - ".github/workflows/zero-propagation.yml"
  pull_request:
    paths:
      - "crates/zero-propagation/**"
      - "docs/physics/zero-real-sound-light-references.md"
      - ".github/workflows/zero-propagation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build benchmark
        run: cargo build --release --manifest-path crates/zero-propagation/Cargo.toml
      - name: Run measurement and verify output labels
        shell: bash
        run: |
          set -euo pipefail
          output="$(cargo run --quiet --release --manifest-path crates/zero-propagation/Cargo.toml -- --distance-m 100 --temperature-c 20 --iterations 100000)"
          printf '%s\n' "$output"
          grep -qx 'STATUS=PASS' <<< "$output"
          grep -qx 'PHYSICAL_PROPAGATION_MEASURED=false' <<< "$output"
          grep -q '^COMPUTE_TIME_NS=[0-9][0-9]*$' <<< "$output"
          grep -q '^SOUND_REFERENCE_TIME_MS=[0-9]' <<< "$output"
          grep -q '^LIGHT_VACUUM_REFERENCE_TIME_NS=[0-9]' <<< "$output"
          grep -q '^CHECKSUM=[0-9][0-9]*$' <<< "$output"
