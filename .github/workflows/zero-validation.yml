name: ZERO validation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test hardware-independent core
        run: go test ./core
      - name: Run native ZERO validation
        run: go run ./tests/zero-native-validation.go
