name: ZERO validation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run reference validator
        shell: pwsh
        run: ./tests/zero-reference-validator.ps1
      - name: Run deterministic truth invariants
        shell: pwsh
        run: ./tests/zero-truth-invariants.ps1
      - name: Run mandatory accessibility gate
        shell: pwsh
        run: ./tests/zero-accessibility-gate.ps1
      - name: Run hardware-independent truth portability
        shell: pwsh
        run: ./tests/zero-truth-portability.ps1
      - name: Run ZERO reference engine
        shell: pwsh
        run: ./tests/zero-reference-engine.ps1
      - name: Run ZERO machine format
        shell: pwsh
        run: ./tests/zero-machine-format.ps1
      - name: Run ZERO machine ISA
        shell: pwsh
        run: ./tests/zero-machine-isa.ps1
      - name: Run ZERO universal execution
        shell: pwsh
        run: ./tests/zero-universal-execution.ps1
      - name: Run ZERO physical support
        shell: pwsh
        run: ./tests/zero-physical-support.ps1
      - name: Run repository-wide acceptance gate
        shell: pwsh
        run: ./tests/zero-repository-gate.ps1
