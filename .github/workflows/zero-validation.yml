name: ZERO validation

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go setup
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Bootstrap unit tests
        working-directory: bootstrap/go
        run: go test ./...

      - name: Core unit tests
        run: go test ./core

      - name: Native ZERO validation
        run: go run ./tests/zero-native-validation.go

      - name: Repository format validation
        shell: pwsh
        run: ./tests/zero-reference-validator.ps1

      - name: Truth invariant validation
        shell: pwsh
        run: ./tests/zero-truth-invariants.ps1

      - name: Universal execution validation
        shell: pwsh
        run: ./tests/zero-universal-execution.ps1

      - name: Machine format validation
        shell: pwsh
        run: ./tests/zero-machine-format.ps1

      - name: Machine ISA validation
        shell: pwsh
        run: ./tests/zero-machine-isa.ps1

      - name: Reference engine validation
        shell: pwsh
        run: ./tests/zero-reference-engine.ps1

      - name: Physical support validation
        shell: pwsh
        run: ./tests/zero-physical-support.ps1

      - name: Truth portability validation
        shell: pwsh
        run: ./tests/zero-truth-portability.ps1

      - name: Accessibility validation
        shell: pwsh
        run: ./tests/zero-accessibility-gate.ps1

      - name: Local component cleanliness
        shell: pwsh
        run: ./tests/no-local-component.ps1
