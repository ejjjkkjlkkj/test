name: ZERO repository inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/zero-repository-inventory.yml"
      - "bootstrap/go/**"
      - "go.mod"
      - "go.sum"
      - "FILE-BY-FILE-AUDIT.md"
      - "REPOSITORY-UNIFICATION-AUDIT.md"
      - "REPOSITORY-TREE-INVENTORY.md"
      - "ZERO-BRANCH-INVENTORY.md"
      - "ZERO-FILE-INVENTORY-PART-*.md"

permissions:
  contents: read

concurrency:
  group: zero-inventory-${{ github.repository }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build deterministic branch and file manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit-output/manifests
          repo="${GITHUB_REPOSITORY}"
          git fetch --all --prune
          gh api --paginate "repos/${repo}/branches?per_page=100" > audit-output/branches.json
          jq -r '.[] | [.name, .commit.sha] | @tsv' audit-output/branches.json > audit-output/branches.tsv
          printf 'repository\tbranch\tcommit_sha\ttree_sha\tfiles\tbytes\tstatus\n' > audit-output/summary.tsv

          while IFS=$'\t' read -r branch commit; do
            [ -n "${branch}" ] || continue
            safe="$(printf '%s' "${branch}" | sha256sum | cut -c1-16)"
            if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
              git fetch origin "${branch}:refs/remotes/origin/${branch}" || true
            fi
            if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
              printf '%s\t%s\t%s\tUNKNOWN\t0\t0\tCOMMIT_NOT_AVAILABLE\n' "${repo}" "${branch}" "${commit}" >> audit-output/summary.tsv
              continue
            fi

            tree="$(git rev-parse "${commit}^{tree}")"
            manifest="audit-output/manifests/${safe}.jsonl"
            python3 - "${commit}" "${manifest}" "${repo}" "${branch}" "${tree}" <<'PY'
          import base64, json, subprocess, sys
          commit, output, repo, branch, tree = sys.argv[1:]
          raw = subprocess.check_output(["git", "ls-tree", "-r", "-l", "-z", "--full-tree", commit])
          with open(output, "w", encoding="utf-8", newline="\n") as f:
              for record in raw.split(b"\0"):
                  if not record:
                      continue
                  meta, path = record.split(b"\t", 1)
                  mode, kind, sha, size_text = meta.decode("ascii").split(" ", 3)
                  size = int(size_text) if size_text != "-" else None
                  row = {
                      "repository": repo, "branch": branch, "commit_sha": commit, "tree_sha": tree,
                      "mode": mode, "type": kind, "object_sha": sha,
                      "size_bytes": size, "path": path.decode("utf-8", "replace"),
                      "path_base64": base64.b64encode(path).decode("ascii")
                  }
                  f.write(json.dumps(row, ensure_ascii=True, separators=(",", ":")) + "\n")
          PY
            read -r files bytes < <(python3 - "${manifest}" <<'PY'
          import json, sys
          count = total = 0
          with open(sys.argv[1], encoding="utf-8") as f:
              for line in f:
                  row = json.loads(line)
                  count += 1
                  if row["type"] == "blob" and row["size_bytes"] is not None:
                      total += row["size_bytes"]
          print(count, total)
          PY
          )
            printf '%s\t%s\t%s\t%s\t%s\t%s\tPASS\n' "${repo}" "${branch}" "${commit}" "${tree}" "${files}" "${bytes}" >> audit-output/summary.tsv
          done < audit-output/branches.tsv

          printf 'Generated at UTC: %s\nRepository: %s\nBranches: %s\n' "$(date -u +%FT%TZ)" "${repo}" "$(wc -l < audit-output/branches.tsv | tr -d ' ')" > audit-output/README.txt
          cat audit-output/summary.tsv

      - name: Validate inventory completeness
        shell: bash
        run: |
          set -euo pipefail
          test -s audit-output/branches.json
          test -s audit-output/summary.tsv
          jq -e 'type == "array"' audit-output/branches.json >/dev/null
          branch_count="$(jq 'length' audit-output/branches.json)"
          summary_count="$(($(wc -l < audit-output/summary.tsv)-1))"
          test "${branch_count}" -eq "${summary_count}"
          echo "PASS: each API-listed branch has a summary row."
          echo "This checks inventory coverage, not source correctness."

      - name: Preserve audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zero-inventory-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 90
